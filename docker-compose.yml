services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentic_shadow
      POSTGRES_USER: agentic_shadow
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_shadow"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
