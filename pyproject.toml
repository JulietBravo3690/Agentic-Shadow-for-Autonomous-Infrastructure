[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-shadow"
version = "0.1.0"
description = "A safe multi-agent digital twin for infrastructure operations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.1,<4",
  "pydantic-settings>=2.2,<3", "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "simulator*"]
